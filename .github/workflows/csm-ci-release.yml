name: csm-ci-release

# Every merged release PR must retain its own publication request.
# jactionlint ignore=concurrency-limits
on:
  pull_request:
    types: [closed]

permissions: {}

jobs:
  release:
    # The reusable workflow accepts the Client App key through inherited secrets.
    # jactionlint ignore=secrets-inherit
    uses: civitaspo/csm-ci-actions/.github/workflows/client-release-publish.yml@82917b4c3a28e5ff4023991ed355b40081d650fb
    secrets: inherit

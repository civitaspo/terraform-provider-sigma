# Aggregates fine-grained wc-* workflow_call units.
# Inputs are event facts from ci.yml — not "which suite to run".

name: PR checks (workflow_call)

on:
  workflow_call:
    inputs:
      autofix:
        description: "True when the caller is a pull_request (enable SecureFix / PR-only jobs)."
        type: boolean
        required: true
      changed_title_only:
        description: "True when the pull_request event action is edited (title change)."
        type: boolean
        required: true

permissions: {}

jobs:
  test:
    if: ${{ !inputs.changed_title_only }}
    uses: ./.github/workflows/wc-test.yml
    permissions:
      contents: read

  goreleaser-check:
    if: ${{ !inputs.changed_title_only }}
    uses: ./.github/workflows/wc-goreleaser-check.yml
    permissions:
      contents: read

  lint:
    if: ${{ !inputs.changed_title_only }}
    uses: ./.github/workflows/wc-lint.yml
    with:
      autofix: ${{ inputs.autofix }}
    secrets: inherit
    permissions:
      contents: read

  pr-title:
    if: ${{ inputs.autofix }}
    uses: ./.github/workflows/wc-pr-title.yml
    permissions:
      pull-requests: read

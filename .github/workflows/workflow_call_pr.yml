# PR aggregator: fans out to wc-* units.
# Reads caller PR event (github.event.action); no menu inputs from the outer workflow.

name: PR checks (workflow_call)

on:
  workflow_call:

permissions: {}

jobs:
  test:
    if: ${{ github.event.action != 'edited' }}
    uses: ./.github/workflows/wc-test.yml
    permissions:
      contents: read

  goreleaser-check:
    if: ${{ github.event.action != 'edited' }}
    uses: ./.github/workflows/wc-goreleaser-check.yml
    permissions:
      contents: read

  lint:
    if: ${{ github.event.action != 'edited' }}
    uses: ./.github/workflows/wc-lint.yml
    with:
      autofix: true
    secrets: inherit
    permissions:
      contents: read

  pr-title:
    uses: ./.github/workflows/wc-pr-title.yml
    permissions:
      pull-requests: read

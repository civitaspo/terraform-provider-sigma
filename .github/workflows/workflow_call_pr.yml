# PR aggregator: fans out to wc-* units.

name: PR checks (workflow_call)

on:
  workflow_call:
    secrets:
      CSM_CI_CLIENT_APP_PRIVATE_KEY:
        required: false

permissions: {}

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  test:
    uses: ./.github/workflows/wc-test.yml
    permissions:
      contents: read

  goreleaser-check:
    uses: ./.github/workflows/wc-goreleaser-check.yml
    permissions:
      contents: read

  autofix:
    uses: ./.github/workflows/wc-autofix.yml
    secrets:
      CSM_CI_CLIENT_APP_PRIVATE_KEY: ${{ secrets.CSM_CI_CLIENT_APP_PRIVATE_KEY }}
    permissions:
      contents: read
      actions: read
      attestations: read

  pr-title:
    uses: ./.github/workflows/wc-pr-title.yml
    permissions:
      pull-requests: read

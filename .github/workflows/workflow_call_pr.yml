name: PR checks (workflow_call)

on:
  workflow_call:
    inputs:
      autofix:
        description: "PR mode: apply autofixes via SecureFix. Push mode: check-only."
        type: boolean
        required: true
      suite:
        description: "full = all jobs; title = pr-title only (PR edited)."
        type: string
        required: true

permissions: {}

jobs:
  test:
    if: ${{ inputs.suite == 'full' }}
    uses: ./.github/workflows/wc-test.yml
    permissions:
      contents: read

  goreleaser-check:
    if: ${{ inputs.suite == 'full' }}
    uses: ./.github/workflows/wc-goreleaser-check.yml
    permissions:
      contents: read

  lint:
    if: ${{ inputs.suite == 'full' }}
    uses: ./.github/workflows/wc-lint.yml
    with:
      autofix: ${{ inputs.autofix }}
    secrets: inherit
    permissions:
      contents: read

  pr-title:
    if: ${{ inputs.autofix && (inputs.suite == 'full' || inputs.suite == 'title') }}
    uses: ./.github/workflows/wc-pr-title.yml
    permissions:
      pull-requests: read

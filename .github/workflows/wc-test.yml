name: test (workflow_call)

on:
  workflow_call:

permissions: {}

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: "2026.8.5"
          install_args: "--locked"
          cache: false

      - name: Build
        if: hashFiles('go.mod') != ''
        run: go build ./...

      - name: Vet
        if: hashFiles('go.mod') != ''
        run: go vet ./...

      - name: Test
        if: hashFiles('go.mod') != ''
        run: go test -race -cover ./...

      - name: Skip until Go module exists
        if: hashFiles('go.mod') == ''
        run: echo "go.mod not present yet; skipping build/vet/test"

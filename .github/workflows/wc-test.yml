name: test (workflow_call)

on:
  workflow_call:

permissions: {}

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: "2026.10.14"
          install_args: "--locked"
          cache: false

      - name: Build
        if: hashFiles('go.mod') != ''
        run: mise run build

      - name: Vet
        if: hashFiles('go.mod') != ''
        run: go vet ./...

      - name: Test
        if: hashFiles('go.mod') != ''
        run: mise run test

      - name: Skip until Go module exists
        if: hashFiles('go.mod') == ''
        run: echo "go.mod not present yet; skipping build/vet/test"

# Autofix (workflow_call). Used from workflow_call_pr.yml.

name: autofix (workflow_call)

on:
  workflow_call:
    secrets:
      CSM_CI_CLIENT_APP_PRIVATE_KEY:
        required: false

permissions: {}

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  autofix:
    name: autofix
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      attestations: read
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Forbid CHANGELOG edits outside release/next
        if: github.head_ref != 'release/next'
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if git diff --name-only "${base}...${head}" | grep -qx 'CHANGELOG.md'; then
            echo "CHANGELOG.md is owned by the Release PR (git-cliff)." >&2
            echo "Do not edit it on feature PRs; use Conventional Commit subjects instead." >&2
            echo "See docs/releasing.md." >&2
            exit 1
          fi

      - name: Set up mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: "2026.10.14"
          install_args: "--locked"
          cache: false

      - name: Fix action pins
        env:
          PINACT_GITHUB_TOKEN: ${{ github.token }}
        run: pinact run

      - name: Disable checkout credentials
        run: disable-checkout-persist-credentials

      - name: Format Go sources
        if: hashFiles('go.mod') != ''
        run: gofmt -w .

      - name: Tidy Go modules
        if: hashFiles('go.mod') != ''
        run: go mod tidy

      - name: Generate provider docs
        if: hashFiles('go.mod') != ''
        run: tfplugindocs generate

      - name: Run ghalint
        run: ghalint run

      - name: Run golangci-lint
        if: hashFiles('go.mod') != ''
        run: golangci-lint run ./...

      - name: Request automated fixes
        uses: civitaspo/csm-ci-actions/actions/client/securefix@85d8fc79ef0ca89ec4cc073d142dab75ebe09a66
        with:
          client-id: ${{ vars.CSM_CI_CLIENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.CSM_CI_CLIENT_APP_PRIVATE_KEY }}
          server-repository: ${{ vars.CSM_CI_SERVER_REPOSITORY }}
          message: "ci: apply automated fixes"

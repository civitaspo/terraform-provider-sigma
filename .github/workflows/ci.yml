name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: "2026.7.14"
          install_args: "--locked"
          cache: false

      - name: Build
        if: hashFiles('go.mod') != ''
        run: go build ./...

      - name: Vet
        if: hashFiles('go.mod') != ''
        run: go vet ./...

      - name: Test
        if: hashFiles('go.mod') != ''
        run: go test -race -cover ./...

      - name: Skip until Go module exists
        if: hashFiles('go.mod') == ''
        run: echo "go.mod not present yet; skipping build/vet/test"

  goreleaser-check:
    name: goreleaser-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: "2026.7.14"
          install_args: "--locked"
          cache: false

      - name: Check GoReleaser configuration
        run: goreleaser check

      - name: Build release snapshot
        run: goreleaser build --snapshot --clean --single-target

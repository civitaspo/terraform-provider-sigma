# Check-only lint (workflow_call). Used from workflow_call_push.yml.

name: lint (workflow_call)

on:
  workflow_call:

permissions: {}

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: "2026.8.5"
          install_args: "--locked"
          cache: false

      - name: Check action pins
        env:
          PINACT_GITHUB_TOKEN: ${{ github.token }}
        run: pinact run --check

      - name: Ensure checkout credentials are disabled
        run: |
          disable-checkout-persist-credentials
          git diff --exit-code -- .github/workflows

      - name: Check Go formatting
        if: hashFiles('go.mod') != ''
        run: test -z "$(gofmt -l .)"

      - name: Check Go modules are tidy
        if: hashFiles('go.mod') != ''
        run: go mod tidy -diff

      - name: Check provider docs are up to date
        if: hashFiles('go.mod') != ''
        run: |
          tfplugindocs generate
          git diff --exit-code -- docs examples

      - name: Run ghalint
        run: ghalint run

      - name: Run golangci-lint
        if: hashFiles('go.mod') != ''
        run: golangci-lint run ./...

      - name: Check for uncommitted changes
        run: git diff --exit-code

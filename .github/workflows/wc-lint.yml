# Check-only lint (workflow_call). Used from workflow_call_push.yml.

name: lint (workflow_call)

on:
  workflow_call:

permissions: {}

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: "2026.8.8"
          install_args: "--locked"
          cache: false

      - name: Check action pins
        env:
          PINACT_GITHUB_TOKEN: ${{ github.token }}
        run: pinact run --check

      - name: Ensure checkout credentials are disabled
        run: |
          disable-checkout-persist-credentials
          git diff --exit-code -- .github/workflows

      - name: Check Go formatting
        if: hashFiles('go.mod') != ''
        run: test -z "$(gofmt -l .)"

      - name: Vet
        if: hashFiles('go.mod') != ''
        run: go vet ./...

      - name: Check Go modules are tidy
        if: hashFiles('go.mod') != ''
        run: go mod tidy -diff

      - name: Check provider docs are up to date
        if: hashFiles('go.mod') != ''
        run: |
          tfplugindocs generate
          git diff --exit-code -- docs examples

      - name: Check generated OpenAPI client is up to date
        if: hashFiles('internal/sigma/openapi/generate.sh') != ''
        run: |
          bash internal/sigma/openapi/generate.sh
          git diff --exit-code -- internal/sigma/openapi/generated.go
          if git status --porcelain -- internal/sigma/openapi/generated.go | grep -q '^[^?]'; then
            echo "generated OpenAPI client has uncommitted changes" >&2
            exit 1
          fi

      - name: Run ghalint
        run: ghalint run

      - name: Run golangci-lint
        if: hashFiles('go.mod') != ''
        run: golangci-lint run ./...

      - name: Check for uncommitted changes
        run: git diff --exit-code

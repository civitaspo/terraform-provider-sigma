name: Release PR Sync

on:
  # Managed release PR updates already synchronize their title and body.
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-pr-sync
  cancel-in-progress: true

jobs:
  sync:
    permissions:
      contents: read
      attestations: read
      pull-requests: write
    uses: civitaspo/securefix-server/.github/workflows/reusable-release-pr-sync.yml@f05a400115ef744070671028865a6269d65bae8b # v0.2.23

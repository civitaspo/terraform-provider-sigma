[tools]
go = "1.26.6"
"aqua:golangci/golangci-lint" = "2.12.2"
"aqua:hashicorp/terraform" = "1.15.9"
"aqua:goreleaser/goreleaser" = "2.17.1"
"go:github.com/hashicorp/terraform-plugin-docs/cmd/tfplugindocs" = "0.25.0"
"go:github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen" = "2.8.0"
"aqua:suzuki-shunsuke/pinact" = "4.1.1"
"aqua:suzuki-shunsuke/ghalint" = "1.5.6"
"aqua:suzuki-shunsuke/disable-checkout-persist-credentials" = "1.0.0"
"aqua:orhun/git-cliff" = "2.13.1"

[tasks.lint]
description = "Run local lint checks"
run = """
#!/usr/bin/env bash
set -euo pipefail
if [ -f go.mod ]; then
  go vet ./...
  golangci-lint run ./...
  test -z "$(gofmt -l .)"
  go mod tidy -diff
  tfplugindocs generate
  git diff --exit-code -- docs examples
fi
if [ -f internal/sigma/openapi/generate.sh ]; then
  bash internal/sigma/openapi/generate.sh
  git diff --exit-code -- internal/sigma/openapi/generated.go
  if git status --porcelain -- internal/sigma/openapi/generated.go | grep -q '^[^?]'; then
    echo "generated OpenAPI client has uncommitted changes" >&2
    exit 1
  fi
fi
if [ -d .github/workflows ]; then
  ghalint run
  pinact run --check
fi
"""

[tasks.test]
description = "Run Go tests with handwritten coverage gates"
run = """
#!/usr/bin/env bash
set -euo pipefail
bash scripts/check-coverage.sh
"""

[tasks.docs]
description = "Generate provider docs with tfplugindocs"
run = """
#!/usr/bin/env bash
set -euo pipefail
tfplugindocs generate
"""

[tasks.build]
description = "Build all packages"
run = """
#!/usr/bin/env bash
set -euo pipefail
if [ ! -f go.mod ]; then
  echo "go.mod not present yet; skipping build"
  exit 0
fi
go build ./...
"""

[tasks.openapi-generate]
description = "Generate the OpenAPI client from the vendored snapshot"
run = "bash internal/sigma/openapi/generate.sh"

[tasks.openapi-update]
description = "Fetch the live Sigma REST OpenAPI snapshot, normalize it, and regenerate. Manual only; never run in CI."
run = """
#!/usr/bin/env bash
set -euo pipefail
curl -fsSL -o specs/sigma-rest-api.openapi.json \\
  https://help.sigmacomputing.com/openapi/sigma-rest-api.json
python3 - <<'PY'
import json
from pathlib import Path
path = Path("specs/sigma-rest-api.openapi.json")
path.write_text(json.dumps(json.loads(path.read_text()), indent=2, ensure_ascii=False) + "\\n")
PY
bash internal/sigma/openapi/generate.sh
"""

[tasks.openapi-check]
description = "Regenerate from the vendored snapshot and fail on generated drift"
run = """
#!/usr/bin/env bash
set -euo pipefail
bash internal/sigma/openapi/generate.sh
git diff --exit-code -- internal/sigma/openapi/generated.go
if git status --porcelain -- internal/sigma/openapi/generated.go | grep -q '^[^?]'; then
  echo "generated OpenAPI client has uncommitted changes" >&2
  exit 1
fi
"""

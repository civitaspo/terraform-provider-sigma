# Selected Sigma REST OpenAPI operation IDs for terraform-provider-sigma.
# This inventory is the source of truth for mise run openapi-generate.
#
# Include retained public Terraform types plus internal generic grant
# operations needed by tagged workbook/report grants. Keep files create
# (operation ID `create`) because sigma_folder uses the folder variant of
# that union. Do not select removed surfaces solely for compatibility:
# public sigma_grant, aggregate sigma_team_members, or dedicated workbook/
# report/workspace create via POST /v2/files beyond the shared create op.
#
# OAuth token acquisition (postToken) is omitted: the live token endpoint
# is form-urlencoded while the snapshot models JSON, and transport keeps a
# dedicated token flow.
#
# Each entry records Terraform type, method/path, operation ID, and the
# Sigma Markdown reference.

operations:
